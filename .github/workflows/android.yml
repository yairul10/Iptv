name: Generar APK de Mi TV
on:
  push:
    branches: [main]
    paths-ignore:
      - app/src/main/assets/channels.json
      - README.md
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validar catálogo, navegación y actualizaciones
        run: python3 tools/validate_catalog.py
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Instalar SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Recuperar firma anterior
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: mitv-preview-signing-v1
      - name: Restaurar firma fija y comprobar identidad
        env:
          PREVIEW_KEYSTORE_BASE64: ${{ secrets.PREVIEW_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$HOME/.android"
          if [ -n "$PREVIEW_KEYSTORE_BASE64" ]; then
            printf '%s' "$PREVIEW_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          fi
          if [ ! -s "$HOME/.android/debug.keystore" ]; then
            echo '::error::Falta la firma original. Restaura PREVIEW_KEYSTORE_BASE64. No se generará una clave diferente.'
            exit 1
          fi
          keytool -exportcert -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -file "$RUNNER_TEMP/signer.der"
          signer=$(sha256sum "$RUNNER_TEMP/signer.der" | cut -d ' ' -f 1)
          if [ -f config/signing-sha256.txt ] && [ "$signer" != "$(tr -d '\n\r ' < config/signing-sha256.txt)" ]; then
            echo '::error::La firma no coincide con la instalación original.'
            exit 1
          fi
          echo "SIGNER_SHA256=$signer" >> "$GITHUB_ENV"
      - name: Crear respaldo cifrado de firma
        run: |
          mkdir -p "$RUNNER_TEMP/signing-recovery"
          openssl cms -encrypt -binary -aes-256-cbc -in "$HOME/.android/debug.keystore" -out "$RUNNER_TEMP/signing-recovery/signing-backup.p7m" -outform DER config/recovery-certificate.pem
          printf '%s\n' "$SIGNER_SHA256" > "$RUNNER_TEMP/signing-recovery/signing-sha256.txt"
      - name: Guardar respaldo cifrado
        uses: actions/upload-artifact@v4
        with:
          name: firma-cifrada
          path: ${{ runner.temp }}/signing-recovery/
          retention-days: 30
      - name: Compilar, probar y revisar
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          gradle --no-daemon testDebugUnitTest lintDebug assembleDebug
          mkdir -p entrega
          cp app/build/outputs/apk/debug/app-debug.apk entrega/Mi-TV.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose entrega/Mi-TV.apk
          sha256sum entrega/Mi-TV.apk > entrega/SHA256.txt
          python3 tools/release_manifest.py
      - name: Descargar APK
        uses: actions/upload-artifact@v4
        with:
          name: Mi-TV-APK
          path: entrega/
          retention-days: 30
      - name: Publicar actualización descargable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v0.3.0-build.${GITHUB_RUN_NUMBER}"
          gh release create "$tag" entrega/Mi-TV.apk entrega/update.json entrega/SHA256.txt --target "$GITHUB_SHA" --title "Mi TV 0.3.0 (${GITHUB_RUN_NUMBER})" --notes 'Lista de canales actualizable por internet y búsqueda de actualizaciones compatibles. Descarga Mi-TV.apk y elige Actualizar, sin desinstalar.' --latest
      - name: Guardar informes de revisión
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: revision-android
          path: |
            app/build/reports/lint-results-*.html
            app/build/reports/tests/
          if-no-files-found: ignore
