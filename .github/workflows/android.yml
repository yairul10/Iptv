name: Generar APK de Popes TV
on:
  push:
    branches: [main]
    paths-ignore:
      - app/src/main/assets/channels.json
      - README.md
      - remote/catalog.json
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validar catálogo, navegación y actualizaciones
        run: python3 tools/validate_catalog.py
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Instalar SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Preparar firma fija privada
        env:
          MITV_SIGNING_BUNDLE: ${{ secrets.MITV_SIGNING_BUNDLE }}
        run: python3 tools/prepare_signing.py
      - name: Compilar, probar y revisar
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          gradle --no-daemon --continue testReleaseUnitTest lintRelease assembleRelease
          if [ "$KEYSTORE_AVAILABLE" != "true" ]; then
            echo "Pruebas completas. Falta guardar MITV_SIGNING_BUNDLE para publicar el APK instalable." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          mkdir -p entrega
          cp app/build/outputs/apk/release/app-release.apk entrega/Mi-TV.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose entrega/Mi-TV.apk
          sha256sum entrega/Mi-TV.apk > entrega/SHA256.txt
          python3 tools/release_manifest.py
      - name: Verificar esquema Room versionado
        run: |
          if [ -n "$(git status --porcelain -- app/schemas)" ]; then
            echo '::error::El esquema Room generado cambió. Guarda el esquema y agrega la migración correspondiente antes de publicar.'
            exit 1
          fi
      - name: Descargar APK
        if: env.KEYSTORE_AVAILABLE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Mi-TV-APK
          path: entrega/
          retention-days: 30
      - name: Publicar actualización descargable
        if: env.KEYSTORE_AVAILABLE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v0.6.8-build.${GITHUB_RUN_NUMBER}"
          gh release create "$tag" entrega/Mi-TV.apk entrega/update.json entrega/SHA256.txt --target "$GITHUB_SHA" --title "Popes TV 0.6.8 (${GITHUB_RUN_NUMBER})" --notes 'Cambia el nombre visible de la app a Popes TV. Conserva los canales, favoritos y ajustes existentes.' --latest
      - name: Guardar informes de revisión
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: revision-android
          path: |
            app/build/reports/lint-results-*.html
            app/build/reports/tests/
            app/schemas/
          if-no-files-found: ignore
