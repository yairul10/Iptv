name: Generar APK de Mi TV
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Instalar SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      # Only a temporary preview key. Configure signing secrets for durable updates.
      - name: Conservar firma de pruebas mientras exista la caché
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: mitv-preview-signing-v1
      - name: Preparar firma personal opcional
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mitv.jks"
          fi
      - name: Compilar y revisar
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -f "$RUNNER_TEMP/mitv.jks" ]; then
            export SIGNING_STORE_FILE="$RUNNER_TEMP/mitv.jks"
            export SIGNING_STORE_PASSWORD="$STORE_PASSWORD"
            export SIGNING_KEY_ALIAS="$KEY_ALIAS"
            export SIGNING_KEY_PASSWORD="$KEY_PASSWORD"
            gradle --no-daemon lintRelease assembleRelease
            apk=app/build/outputs/apk/release/app-release.apk
          else
            gradle --no-daemon lintDebug assembleDebug
            apk=app/build/outputs/apk/debug/app-debug.apk
          fi
          mkdir -p entrega
          cp "$apk" entrega/Mi-TV.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose entrega/Mi-TV.apk
          sha256sum entrega/Mi-TV.apk > entrega/SHA256.txt
      - name: Descargar APK
        uses: actions/upload-artifact@v4
        with:
          name: Mi-TV-APK
          path: entrega/
          retention-days: 30
      - name: Guardar informes de revisión
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: revision-android
          path: app/build/reports/lint-results-*.html
          if-no-files-found: ignore
