name: Revisar lista de canales
on:
  push:
    branches: [main]
    paths: [app/src/main/assets/channels.json]
  pull_request:
    paths: [app/src/main/assets/channels.json]
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python3 tools/validate_catalog.py
