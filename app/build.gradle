plugins { id 'com.android.application' }
android {
    namespace 'cl.mitv.app'
    buildFeatures { buildConfig true }
    compileSdk 35
    defaultConfig {
        applicationId 'cl.mitv.app.preview'
        minSdk 23
        targetSdk 35
        javaCompileOptions { annotationProcessorOptions { arguments += ["room.schemaLocation": "$projectDir/schemas".toString()] } }
        versionCode Integer.parseInt(System.getenv('BUILD_NUMBER') ?: '1')
        versionName '0.6.8'
    }
    sourceSets { test.resources.srcDir("$projectDir/schemas") }
    testOptions { unitTests.includeAndroidResources = true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    if (System.getenv('SIGNING_STORE_FILE')) {
        signingConfigs {
            personal {
                storeFile file(System.getenv('SIGNING_STORE_FILE'))
                storePassword System.getenv('SIGNING_STORE_PASSWORD')
                keyAlias System.getenv('SIGNING_KEY_ALIAS')
                keyPassword System.getenv('SIGNING_KEY_PASSWORD')
            }
        }
        buildTypes { release { signingConfig signingConfigs.personal } }
    }
    buildTypes { debug { versionNameSuffix '-desarrollo' } }
}

dependencies {
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.6.2'
    implementation 'androidx.work:work-runtime:2.9.0'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.media3:media3-exoplayer:1.3.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.3.1'
    implementation 'androidx.media3:media3-ui:1.3.1'
    testImplementation 'org.robolectric:robolectric:4.12.2'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testImplementation 'androidx.arch.core:core-testing:2.2.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
